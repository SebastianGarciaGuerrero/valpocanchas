name: Pruebas de la base

on:
  push:
  pull_request:

jobs:
  reglas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Simular Supabase y aplicar migraciones
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00_simula_supabase.sql
          for f in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Reglas de negocio
        run: psql -X -f supabase/tests/reglas_reserva.test.sql

      - name: CP-002 (doble reserva simultánea)
        run: |
          CANCHA=$(psql -X -At -c "select id from canchas where nombre = 'Cancha 1'")
          PSQL=psql ./supabase/tests/cp002_concurrencia.sh "$CANCHA"
